<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Imam &amp; Mia — Undangan Lamaran · 27.09.2026</title>
<meta name="description" content="And Finally These kids are Getting Engaged! Undangan lamaran Imam &amp; Mia, Minggu 27 September 2026, Mia's House, Pasarkemis, Tangerang." />
<meta name="theme-color" content="#6D1133" />
<meta property="og:title" content="Imam &amp; Mia — Undangan Lamaran" />
<meta property="og:description" content="Minggu, 27 September 2026 · 13.00 - selesai · Mia's House, Pasarkemis" />
<meta property="og:image" content="assets/hero-card.webp" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Italianno&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="locked">

<canvas id="sparkles" aria-hidden="true"></canvas>

<!-- ═══════════════ COVER ═══════════════ -->
<div id="cover" class="cover">
  <div class="cover-flap" aria-hidden="true"></div>
  <img class="bow bow-tl" src="assets/bow-ribbon.webp" alt="" aria-hidden="true" />
  <img class="bow bow-tr" src="assets/bow-ribbon.webp" alt="" aria-hidden="true" />
  <img class="bow bow-bl" src="assets/bow-ribbon.webp" alt="" aria-hidden="true" />
  <img class="bow bow-br" src="assets/bow-ribbon.webp" alt="" aria-hidden="true" />

  <div class="cover-inner">
    <img class="badge-af" src="assets/badge-andfinally.webp" alt="And Finally" />
    <img class="hero-card" src="assets/hero-card.webp"
         alt="These kids are Getting Engaged! Imam &amp; Mia — 27.09.2026" />

    <div class="guest-box" id="guestBox">
      <p class="guest-label">Kepada Yth. Bapak/Ibu/Saudara/i</p>
      <p class="guest-name" id="guestName">Tamu Undangan</p>
      <span class="guest-rule" aria-hidden="true"></span>
    </div>

    <button class="open-btn" id="openBtn" type="button" aria-label="Buka undangan">
      <img src="assets/btn-shape.webp" alt="Open Invitation" />
    </button>
    <p class="open-hint">Ketuk untuk membuka undangan</p>
  </div>
</div>

<!-- ═══════════════ MAIN ═══════════════ -->
<main id="main" class="main" aria-hidden="true">

  <!-- SAVE THE DATE -->
  <section class="sec sec-date" id="tanggal">
    <div class="doily-wrap reveal">
      <img class="doily-savedate" src="assets/doily-savedate.webp" alt="Save the date!" />
    </div>

    <img class="band" src="assets/gold-band.webp" alt="" aria-hidden="true" />

    <div class="date-block reveal">
      <img class="date-row" src="assets/date-row.webp" alt="Minggu, 27 September 2026" />
      <img class="pill-time" src="assets/pill-time.webp" alt="13.00 - selesai" />
    </div>

    <img class="band" src="assets/gold-band.webp" alt="" aria-hidden="true" />

    <div class="countdown reveal" aria-live="polite">
      <p class="script-h">Menuju hari bahagia</p>
      <div class="cd-grid" id="cdGrid">
        <div class="cd-cell"><span id="cdD">00</span><small>Hari</small></div>
        <div class="cd-cell"><span id="cdH">00</span><small>Jam</small></div>
        <div class="cd-cell"><span id="cdM">00</span><small>Menit</small></div>
        <div class="cd-cell"><span id="cdS">00</span><small>Detik</small></div>
      </div>
      <div class="btn-row">
        <a class="pbtn" id="gcal" href="#" target="_blank" rel="noopener">Google Calendar</a>
        <a class="pbtn ghost" id="ical" href="#" download="lamaran-imam-mia.ics">Apple Calendar</a>
      </div>
    </div>

    <img class="gold-bow reveal" src="assets/gold-bow.webp" alt="" aria-hidden="true" />
  </section>

  <!-- LOCATION (single, consolidated location point) -->
  <section class="sec sec-loc" id="lokasi">
    <img class="band" src="assets/gold-band.webp" alt="" aria-hidden="true" />
    <img class="label reveal" src="assets/label-location.webp" alt="Location" />
    <img class="oval-address reveal" src="assets/oval-address.webp"
         alt="Mia's House, Jl. Pepaya 4 No. 9, Pondok Makmur, Rt.005/Rw.007, Kutabaru, Pasarkemis, Tangerang" />

    <div class="btn-row reveal">
      <button class="pbtn ghost" id="copyAddr" type="button">Salin Alamat</button>
    </div>

    <div class="map-frame reveal">
      <div class="map-inner">
        <iframe id="mapFrame" title="Peta lokasi Mia's House" loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>

    <div class="btn-row reveal">
      <a class="pbtn pulse" id="mapsBtn" target="_blank" rel="noopener" href="#">Petunjuk Lokasi (Google Maps)</a>
    </div>
    <img class="band" src="assets/gold-band.webp" alt="" aria-hidden="true" />
  </section>

  <!-- DRESSCODE -->
  <section class="sec sec-dress" id="dresscode">
    <img class="flower fl-l" src="assets/flowers.webp" alt="" aria-hidden="true" />
    <img class="flower fl-r" src="assets/flowers.webp" alt="" aria-hidden="true" />
    <img class="badge-dress reveal" src="assets/badge-dresscode.webp" alt="Dresscode" />
    <img class="dress-card reveal" src="assets/dress-card.webp"
         alt="Dresscode: Maroon, Beige, Gold, Baby Pink, Black" />
    <p class="dress-note reveal">Mohon kenakan salah satu warna di atas — biar kenangannya makin senada.</p>
  </section>

  <!-- CLOSING -->
  <section class="sec sec-close" id="penutup">
    <img class="band" src="assets/gold-band.webp" alt="" aria-hidden="true" />
    <img class="heart-photo reveal" src="assets/heart-photo.webp" alt="Imam &amp; Mia" />
    <img class="badge-join reveal" src="assets/badge-join.webp" alt="Join us to celebrate!" />
    <img class="band" src="assets/gold-band.webp" alt="" aria-hidden="true" />
    <p class="credit">Undangan digital · 27.09.2026</p>
  </section>
</main>

<!-- MUSIC WIDGET -->
<button class="music-fab" id="musicFab" type="button" aria-label="Putar / hentikan musik" hidden>
  <span class="disc" aria-hidden="true"></span>
  <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
  <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 5.5h3.2v13H7.5zm5.8 0h3.2v13h-3.2z"/></svg>
</button>
<audio id="bgm" src="assets/custom-music.mp3" loop preload="auto"></audio>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
